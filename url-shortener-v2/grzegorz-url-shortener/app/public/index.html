<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>URL Shortener</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #080b0f; --surface: #0f1318; --surface2: #161c24;
  --border: #1e2836; --border2: #263040;
  --text: #e8edf3; --text2: #7a8fa6; --text3: #4a5f78;
  --accent: #4f8ef7; --accent2: #7c3aed;
  --success: #10b981; --danger: #ef4444; --warning: #f59e0b;
  --radius: 10px; --mono: 'JetBrains Mono', monospace; --display: 'Syne', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 14px; min-height: 100vh; -webkit-font-smoothing: antialiased; }
::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: var(--surface); } ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* Layout */
header { border-bottom: 1px solid var(--border); padding: .9rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; position: sticky; top: 0; background: var(--bg); z-index: 10; }
.logo { display: flex; align-items: center; gap: .6rem; font-family: var(--display); font-weight: 800; font-size: 1.1rem; }
.logo-icon { background: var(--accent); color: #fff; border-radius: 8px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
main { max-width: 860px; width: 100%; margin: 0 auto; padding: 1.5rem 1rem; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: .65rem; margin-bottom: 1.25rem; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .85rem 1rem; }
.stat-num { font-family: var(--display); font-weight: 800; font-size: 1.7rem; }
.stat-lbl { font-size: .72rem; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; margin-top: .2rem; }

/* Toolbar */
.toolbar { display: flex; gap: .65rem; margin-bottom: 1.1rem; align-items: center; flex-wrap: wrap; }
.search-wrap { flex: 1; min-width: 180px; display: flex; align-items: center; gap: .5rem; background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: .55rem .85rem; }
.search-wrap input { background: none; border: none; outline: none; color: var(--text); font-family: var(--mono); font-size: .875rem; width: 100%; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: .4rem; border: none; border-radius: var(--radius); padding: .6rem 1rem; font-family: var(--mono); font-size: .825rem; font-weight: 600; cursor: pointer; transition: opacity .15s; }
.btn:hover { opacity: .85; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-ghost { background: var(--surface); border: 1px solid var(--border2); color: var(--text2); }
.btn-danger { background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.3); color: var(--danger); }
.btn-sm { padding: .38rem .65rem; font-size: .75rem; border-radius: 6px; }

/* Import/export row */
.export-row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }

/* Link cards */
.links { display: flex; flex-direction: column; gap: .6rem; }
.link-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .95rem 1.1rem; transition: opacity .2s; }
.link-card.disabled { opacity: .5; }
.link-top { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin-bottom: .45rem; }
.slug-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.slug-text { font-weight: 700; color: var(--accent); font-size: .95rem; cursor: pointer; }
.slug-text:hover { text-decoration: underline; }
.target-url { flex: 1; font-size: .8rem; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link-meta { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; font-size: .75rem; color: var(--text3); margin-bottom: .55rem; }
.link-meta .warn { color: var(--warning); }
.link-actions { display: flex; gap: .4rem; flex-wrap: wrap; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.72); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 1rem; }
.modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 14px; width: 100%; max-width: 500px; max-height: 90vh; overflow: auto; animation: fadeUp .2s ease; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 1.1rem 1.4rem; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); }
.modal-title { font-family: var(--display); font-weight: 700; font-size: 1rem; }
.modal-body { padding: 1.3rem 1.4rem; display: flex; flex-direction: column; gap: .9rem; }
.modal-footer { padding: .9rem 1.4rem; border-top: 1px solid var(--border); display: flex; gap: .65rem; justify-content: flex-end; }
.close-btn { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 1.2rem; line-height: 1; }

/* Form */
.field { display: flex; flex-direction: column; gap: .35rem; }
.field label { font-size: .72rem; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; }
.field input { background: var(--surface2); border: 1px solid var(--border2); color: var(--text); border-radius: var(--radius); padding: .6rem .85rem; font-size: .875rem; font-family: var(--mono); outline: none; width: 100%; transition: border-color .15s; }
.field input:focus { border-color: var(--accent); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
.slug-row { display: flex; gap: .4rem; }
.slug-row input { flex: 1; }

/* Error */
.error-msg { color: var(--danger); font-size: .825rem; background: rgba(239,68,68,.1); padding: .55rem .85rem; border-radius: var(--radius); border: 1px solid rgba(239,68,68,.25); }
.success-msg { color: var(--success); font-size: .825rem; background: rgba(16,185,129,.1); padding: .55rem .85rem; border-radius: var(--radius); border: 1px solid rgba(16,185,129,.25); }

/* Analytics modal */
.analytics-stats { display: grid; grid-template-columns: 1fr 1fr; gap: .65rem; margin-bottom: 1.25rem; }
.a-stat { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: .85rem 1rem; }
.a-stat-num { font-family: var(--display); font-size: 2rem; font-weight: 800; color: var(--accent); }
.a-stat-lbl { font-size: .72rem; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; margin-top: .2rem; }
.section-title { font-family: var(--display); font-weight: 700; font-size: .875rem; color: var(--text2); margin-bottom: .65rem; }
.bar-row { display: flex; align-items: center; gap: .65rem; padding: .4rem 0; border-bottom: 1px solid var(--border); }
.bar-label { font-size: .78rem; color: var(--text2); min-width: 88px; }
.bar-track { flex: 1; height: 5px; border-radius: 3px; background: var(--border2); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; background: var(--accent); transition: width .4s ease; }
.bar-count { font-size: .78rem; font-weight: 700; min-width: 28px; text-align: right; }

/* QR modal */
.qr-wrap { background: #fff; border-radius: 10px; padding: 1rem; line-height: 0; box-shadow: 0 0 0 4px var(--surface2); display: inline-block; }
.qr-url { font-family: var(--mono); font-size: .8rem; color: var(--accent); background: var(--surface2); padding: .5rem 1rem; border-radius: var(--radius); border: 1px solid var(--border2); margin: .75rem 0; }

/* Empty state */
.empty { text-align: center; padding: 4rem 2rem; color: var(--text3); }
.empty-icon { font-size: 3rem; margin-bottom: 1rem; opacity: .3; }
.empty-title { font-family: var(--display); font-weight: 700; font-size: 1.1rem; margin-bottom: .4rem; color: var(--text2); }

/* Spinner */
@keyframes spin { to { transform: rotate(360deg); } }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin .65s linear infinite; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🔗</div>
    URL Shortener
  </div>
  <div class="export-row">
    <button class="btn btn-ghost" onclick="exportJSON()">⬇ JSON</button>
    <button class="btn btn-ghost" onclick="exportCSV()">⬇ CSV</button>
    <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()">⬆ Import</button>
    <input type="file" id="importFile" accept=".json,.csv" style="display:none" onchange="importFile(event)"/>
    <span id="importMsg" style="display:none;font-size:.8rem;"></span>
  </div>
</header>

<main>
  <!-- Stats -->
  <div class="stats" id="stats">
    <div class="stat-card"><div class="stat-num" id="s-total">–</div><div class="stat-lbl">Total Links</div></div>
    <div class="stat-card"><div class="stat-num" id="s-active">–</div><div class="stat-lbl">Active</div></div>
    <div class="stat-card"><div class="stat-num" id="s-clicks">–</div><div class="stat-lbl">Total Clicks</div></div>
    <div class="stat-card"><div class="stat-num" id="s-expired">–</div><div class="stat-lbl">Expired</div></div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-wrap">
      <span style="color:var(--text3)">🔍</span>
      <input type="text" id="search" placeholder="Search slugs or URLs…" oninput="renderLinks()"/>
    </div>
    <button class="btn btn-ghost" onclick="loadLinks()" id="refreshBtn">↺ Refresh</button>
    <button class="btn btn-primary" onclick="openCreate()">＋ New Link</button>
  </div>

  <!-- Links -->
  <div class="links" id="links-list">
    <div class="empty"><div class="spin"></div></div>
  </div>
</main>

<!-- ═══════════════════ CREATE MODAL ═══════════════════ -->
<div class="modal-overlay" id="createModal" style="display:none" onclick="if(event.target===this)closeCreate()">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">New Short Link</span>
      <button class="close-btn" onclick="closeCreate()">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Destination URL *</label>
        <input type="url" id="c-url" placeholder="https://example.com/very/long/url"/>
      </div>
      <div class="field">
        <label>Custom Slug (optional)</label>
        <div class="slug-row">
          <input type="text" id="c-slug" placeholder="my-custom-slug"/>
          <button class="btn btn-ghost btn-sm" onclick="randomSlug()" title="Random">⚄</button>
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Expires At</label>
          <input type="datetime-local" id="c-expires"/>
        </div>
        <div class="field">
          <label>Max Clicks</label>
          <input type="number" id="c-maxclicks" placeholder="∞" min="1"/>
        </div>
      </div>
      <div class="field">
        <label>Password (optional)</label>
        <input type="password" id="c-pw" placeholder="Leave blank for public"/>
      </div>
      <div id="c-error" style="display:none" class="error-msg"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeCreate()">Cancel</button>
      <button class="btn btn-primary" id="c-submit" onclick="createLink()">Create Link</button>
    </div>
  </div>
</div>

<!-- ═══════════════════ ANALYTICS MODAL ═══════════════════ -->
<div class="modal-overlay" id="analyticsModal" style="display:none" onclick="if(event.target===this)closeAnalytics()">
  <div class="modal" style="max-width:560px">
    <div class="modal-header">
      <div>
        <div class="modal-title">Analytics</div>
        <div style="font-size:.8rem;color:var(--accent)" id="a-slug"></div>
      </div>
      <button class="close-btn" onclick="closeAnalytics()">✕</button>
    </div>
    <div class="modal-body" id="a-body">
      <div style="text-align:center;padding:2rem;color:var(--text3)"><div class="spin"></div></div>
    </div>
  </div>
</div>

<!-- ═══════════════════ QR MODAL ═══════════════════ -->
<div class="modal-overlay" id="qrModal" style="display:none" onclick="if(event.target===this)closeQR()">
  <div class="modal" style="max-width:340px">
    <div class="modal-header">
      <span class="modal-title">QR Code</span>
      <button class="close-btn" onclick="closeQR()">✕</button>
    </div>
    <div class="modal-body" style="align-items:center">
      <div class="qr-wrap" id="qr-img-wrap"></div>
      <div class="qr-url" id="qr-url-text"></div>
      <a id="qr-download" download class="btn btn-primary">⬇ Download SVG</a>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let links = [];

// ── API ────────────────────────────────────────────────────────────────────
async function api(method, path, body) {
  const res = await fetch('/api' + path, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    throw new Error(e.error || 'HTTP ' + res.status);
  }
  return res.json();
}

// ── Load & Render ──────────────────────────────────────────────────────────
async function loadLinks() {
  const btn = document.getElementById('refreshBtn');
  btn.innerHTML = '<span class="spin"></span>';
  try {
    links = await api('GET', '/links');
    renderLinks();
  } catch(e) {
    document.getElementById('links-list').innerHTML =
      '<div class="empty"><div class="empty-title" style="color:var(--danger)">Failed to load: ' + e.message + '</div></div>';
  } finally {
    btn.innerHTML = '↺ Refresh';
  }
}

function isExpired(l) {
  if (l.expires_at && new Date(l.expires_at) < new Date()) return true;
  if (l.max_clicks && l.click_count >= l.max_clicks) return true;
  return false;
}

function renderLinks() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = links.filter(l =>
    l.slug.toLowerCase().includes(q) || l.target_url.toLowerCase().includes(q)
  );

  // Update stats
  const totalClicks = links.reduce((s, l) => s + (l.click_count || 0), 0);
  document.getElementById('s-total').textContent = links.length;
  document.getElementById('s-active').textContent = links.filter(l => l.active).length;
  document.getElementById('s-clicks').textContent = totalClicks;
  document.getElementById('s-expired').textContent = links.filter(isExpired).length;

  const container = document.getElementById('links-list');

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty">
      <div class="empty-icon">🔗</div>
      <div class="empty-title">${q ? 'No matching links' : 'No links yet'}</div>
      <div style="font-size:.875rem;margin-top:.35rem">${q ? 'Try a different search.' : 'Click "New Link" to create your first short URL.'}</div>
    </div>`;
    return;
  }

  container.innerHTML = filtered.map(l => {
    const expired = isExpired(l);
    const dotColor = !l.active ? 'var(--text3)' : expired ? 'var(--warning)' : 'var(--success)';
    const shortUrl = window.location.origin + '/' + l.slug;
    const expiresStr = l.expires_at ? new Date(l.expires_at).toLocaleDateString() : '';
    const clickStr = (l.click_count || 0) + ' click' + (l.click_count !== 1 ? 's' : '') + (l.max_clicks ? ' / ' + l.max_clicks : '');

    return `<div class="link-card${l.active ? '' : ' disabled'}" id="card-${l.id}">
      <div class="link-top">
        <div class="slug-dot" style="background:${dotColor}"></div>
        <span class="slug-text" onclick="copyUrl('${shortUrl}', this)">/${l.slug}</span>
        ${l.password ? '<span title="Password protected" style="font-size:.85rem">🔒</span>' : ''}
        <span class="target-url" title="${escHtml(l.target_url)}">→ ${escHtml(l.target_url)}</span>
      </div>
      <div class="link-meta">
        <span>🖱 ${clickStr}</span>
        ${l.expires_at ? `<span class="${expired ? 'warn' : ''}">⏰ ${expired ? 'Expired' : expiresStr}</span>` : ''}
        <span style="margin-left:auto">${new Date(l.created_at).toLocaleDateString()}</span>
      </div>
      <div class="link-actions">
        <button class="btn btn-ghost btn-sm" onclick="copyUrl('${shortUrl}', this)">📋 Copy</button>
        <button class="btn btn-ghost btn-sm" onclick="window.open('${shortUrl}','_blank')">↗ Open</button>
        <button class="btn btn-ghost btn-sm" onclick="showQR(${l.id}, '${l.slug}')">⬛ QR</button>
        <button class="btn btn-ghost btn-sm" onclick="showAnalytics(${l.id}, '${l.slug}')">📊 Stats</button>
        <button class="btn btn-ghost btn-sm" onclick="toggleLink(${l.id}, ${l.active})">${l.active ? '⏸ Disable' : '▶ Enable'}</button>
        <button class="btn btn-danger btn-sm" onclick="deleteLink(${l.id})">🗑 Delete</button>
      </div>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Copy ───────────────────────────────────────────────────────────────────
function copyUrl(url, el) {
  navigator.clipboard.writeText(url).then(() => {
    const orig = el.innerHTML;
    if (el.tagName === 'BUTTON') el.innerHTML = '✓ Copied';
    else el.style.color = 'var(--success)';
    setTimeout(() => {
      if (el.tagName === 'BUTTON') el.innerHTML = orig;
      else el.style.color = '';
    }, 1500);
  });
}

// ── Create Link ────────────────────────────────────────────────────────────
function openCreate() {
  document.getElementById('c-url').value = '';
  document.getElementById('c-slug').value = '';
  document.getElementById('c-expires').value = '';
  document.getElementById('c-maxclicks').value = '';
  document.getElementById('c-pw').value = '';
  document.getElementById('c-error').style.display = 'none';
  document.getElementById('createModal').style.display = 'flex';
  setTimeout(() => document.getElementById('c-url').focus(), 50);
}

function closeCreate() { document.getElementById('createModal').style.display = 'none'; }

function randomSlug() {
  const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
  let s = '';
  for (let i = 0; i < 6; i++) s += chars[Math.floor(Math.random() * chars.length)];
  document.getElementById('c-slug').value = s;
}

async function createLink() {
  const btn = document.getElementById('c-submit');
  const errEl = document.getElementById('c-error');
  errEl.style.display = 'none';

  const payload = { target_url: document.getElementById('c-url').value.trim() };
  const slug = document.getElementById('c-slug').value.trim();
  const expires = document.getElementById('c-expires').value;
  const maxClicks = document.getElementById('c-maxclicks').value;
  const pw = document.getElementById('c-pw').value;

  if (slug) payload.slug = slug;
  if (expires) payload.expires_at = expires;
  if (maxClicks) payload.max_clicks = parseInt(maxClicks);
  if (pw) payload.password = pw;

  btn.innerHTML = '<span class="spin"></span> Creating…';
  btn.disabled = true;

  try {
    const link = await api('POST', '/links', payload);
    links.unshift({ ...link, click_count: 0 });
    renderLinks();
    closeCreate();
  } catch(e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally {
    btn.innerHTML = 'Create Link';
    btn.disabled = false;
  }
}

// ── Delete / Toggle ────────────────────────────────────────────────────────
async function deleteLink(id) {
  if (!confirm('Delete this link?')) return;
  await api('DELETE', '/links/' + id);
  links = links.filter(l => l.id !== id);
  renderLinks();
}

async function toggleLink(id, active) {
  await api('PUT', '/links/' + id, { active: !active });
  const l = links.find(x => x.id === id);
  if (l) l.active = active ? 0 : 1;
  renderLinks();
}

// ── Analytics ──────────────────────────────────────────────────────────────
async function showAnalytics(id, slug) {
  document.getElementById('a-slug').textContent = '/' + slug;
  document.getElementById('a-body').innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text3)"><div class="spin"></div></div>';
  document.getElementById('analyticsModal').style.display = 'flex';

  try {
    const data = await api('GET', '/links/' + id + '/analytics');
    const maxDay = Math.max(...data.clicks.map(c => c.count), 1);
    const maxRef = Math.max(...data.referrers.map(r => r.count), 1);

    document.getElementById('a-body').innerHTML = `
      <div class="analytics-stats">
        <div class="a-stat"><div class="a-stat-num">${data.total}</div><div class="a-stat-lbl">Total Clicks</div></div>
        <div class="a-stat"><div class="a-stat-num">${data.referrers.length}</div><div class="a-stat-lbl">Referrer Sources</div></div>
      </div>
      <div class="section-title">📅 Clicks per Day (last 30)</div>
      ${data.clicks.length === 0 ? '<div style="color:var(--text3);font-size:.85rem">No clicks yet.</div>' :
        data.clicks.map(c => `<div class="bar-row">
          <span class="bar-label">${c.date}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(c.count/maxDay*100)}%"></div></div>
          <span class="bar-count">${c.count}</span>
        </div>`).join('')
      }
      <div class="section-title" style="margin-top:1.25rem">🌐 Top Referrers</div>
      ${data.referrers.length === 0 ? '<div style="color:var(--text3);font-size:.85rem">No referrer data yet.</div>' :
        data.referrers.map(r => `<div class="bar-row">
          <span class="bar-label" style="min-width:120px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escHtml(r.referrer)}">${escHtml(r.referrer)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round(r.count/maxRef*100)}%"></div></div>
          <span class="bar-count">${r.count}</span>
        </div>`).join('')
      }
    `;
  } catch(e) {
    document.getElementById('a-body').innerHTML = '<div style="color:var(--danger)">' + e.message + '</div>';
  }
}

function closeAnalytics() { document.getElementById('analyticsModal').style.display = 'none'; }

// ── QR Code ────────────────────────────────────────────────────────────────
async function showQR(id, slug) {
  const host = window.location.origin;
  const shortUrl = host + '/' + slug;
  const qrSrc = '/api/links/' + id + '/qr?host=' + encodeURIComponent(host);

  document.getElementById('qr-img-wrap').innerHTML = '<img src="' + qrSrc + '" width="200" height="200" alt="QR Code"/>';
  document.getElementById('qr-url-text').textContent = shortUrl;
  document.getElementById('qr-download').href = qrSrc;
  document.getElementById('qr-download').download = 'qr-' + slug + '.svg';
  document.getElementById('qrModal').style.display = 'flex';
}

function closeQR() { document.getElementById('qrModal').style.display = 'none'; }

// ── Import / Export ────────────────────────────────────────────────────────
function exportJSON() { window.location.href = '/api/export/json'; }
function exportCSV()  { window.location.href = '/api/export/csv'; }

async function importFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const msgEl = document.getElementById('importMsg');
  msgEl.style.display = 'inline';
  msgEl.style.color = 'var(--text2)';
  msgEl.textContent = 'Importing…';

  try {
    const text = await file.text();
    let items;
    if (file.name.endsWith('.json')) {
      items = JSON.parse(text);
    } else {
      const rows = text.trim().split('\n').slice(1);
      items = rows.map(row => {
        const cols = row.split(',').map(c => c.replace(/^"|"$/g, ''));
        return { slug: cols[0], target_url: cols[1], expires_at: cols[2] || null, max_clicks: cols[3] ? parseInt(cols[3]) : null, active: cols[4] === '1' ? 1 : 0 };
      });
    }
    const result = await api('POST', '/import', { links: items });
    msgEl.style.color = 'var(--success)';
    msgEl.textContent = '✓ ' + result.imported + ' imported, ' + result.skipped + ' skipped';
    await loadLinks();
  } catch(err) {
    msgEl.style.color = 'var(--danger)';
    msgEl.textContent = '✗ ' + err.message;
  }
  e.target.value = '';
  setTimeout(() => { msgEl.style.display = 'none'; }, 4000);
}

// ── Keyboard shortcuts ─────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeCreate(); closeAnalytics(); closeQR(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openCreate(); }
});

// ── Init ───────────────────────────────────────────────────────────────────
loadLinks();
</script>
