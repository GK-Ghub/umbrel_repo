name: Build & Push Docker Image

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./grzegorz-url-shortener/app
          file: ./grzegorz-url-shortener/app/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/grzegorz-url-shortener:latest
            ghcr.io/${{ github.repository_owner }}/grzegorz-url-shortener:${{ github.sha }}
