manifestVersion: 1
id: grzegorz-gitlab-runner
name: GitLab Runner
tagline: Connect your Umbrel to your local GitLab CI/CD pipelines
icon: https://about.gitlab.com/images/press/logo/png/gitlab-icon-rgb.png
category: developer
version: "17.0"
port: 9252
description: >-
  GitLab Runner is the agent that runs your CI/CD pipeline jobs defined in .gitlab-ci.yml files.


  This app connects directly to your local GitLab instance at http://192.168.1.225:8929 and executes jobs inside isolated Docker containers — no cloud required.


  To connect the runner to your GitLab instance:
  1. Open your GitLab at http://192.168.1.225:8929
  2. Go to Admin Area → CI/CD → Runners → New instance runner (or per group/project)
  3. Copy the token (starts with glrt-)
  4. SSH into your Umbrel and run the registration command shown in the app README

developer: Grzegorz
website: https://docs.gitlab.com/runner/
dependencies: []
repo: https://github.com/grzegorz/umbrel-app-store
support: https://docs.gitlab.com/runner/
gallery:
  - https://about.gitlab.com/images/ci/gitlab-ci-cd-logo.png
releaseNotes: >-
  Initial release. Runs GitLab Runner as a Docker executor, mounted to the Umbrel Docker socket.
  Supports Docker-in-Docker (DinD) builds via privileged mode.
submitter: Grzegorz
submission: https://github.com/grzegorz/umbrel-app-store
