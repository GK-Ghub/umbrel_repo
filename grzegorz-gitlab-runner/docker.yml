name: Build & Push GitLab Runner image

on:
  push:
    branches: [main, master]
    paths:
      - "grzegorz-gitlab-runner/Dockerfile"
      - "grzegorz-gitlab-runner/entrypoint.sh"
      - "grzegorz-gitlab-runner/ui/**"
      - ".github/workflows/docker.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # needed to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM64 — Umbrel runs on Raspberry Pi)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # automatic, no setup needed

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./grzegorz-gitlab-runner
          platforms: linux/amd64,linux/arm64      # amd64 = PC, arm64 = Raspberry Pi
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gitlab-runner-umbrel:latest
            ghcr.io/${{ github.repository_owner }}/gitlab-runner-umbrel:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
