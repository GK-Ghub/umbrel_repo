services:
  app_proxy:
    environment:
      APP_HOST: grzegorz-gitlab-runner_runner_1
      APP_PORT: 9252
      PROXY_AUTH_ADD: "false"

  runner:
    build: .                    # builds Dockerfile in the same folder
    image: grzegorz-gitlab-runner
    restart: on-failure
    network_mode: host          # lets the runner reach 192.168.1.225:8929 directly
    volumes:
      # Persist runner config (registration token, settings) across restarts
      - ${APP_DATA_DIR}/config:/etc/gitlab-runner
      # Expose Umbrel's Docker socket so the runner can spin up job containers
      - /var/run/docker.sock:/var/run/docker.sock
