name: Build & Push Ping Monitor

on:
  push:
    branches: [master]
    paths:
      - 'grzegorz-ping-monitor/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: set lower case owner name
        run: |
          echo "OWNER_LC=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> ${GITHUB_ENV}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./grzegorz-ping-monitor/app
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/grzegorz-ping-monitor:latest
            ghcr.io/${{ env.OWNER_LC }}/grzegorz-ping-monitor:${{ github.sha }}
