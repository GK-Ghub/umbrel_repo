version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: grzegorz-url-shortener_server_1
      APP_PORT: 4090

  server:
    image: ghcr.io/gk-ghub/grzegorz-url-shortener:latest
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      - DATA_DIR=/data
      - PORT=4090
