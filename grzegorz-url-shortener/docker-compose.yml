version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: grzegorz-url-shortener_server_1
      APP_PORT: 4090

  server:
    image: ghcr.io/gk-ghub/grzegorz-url-shortener:latest
    restart: on-failure
    stop_grace_period: 1m
    # DODAJEMY TĘ SEKCJĘ:
    ports:
      - "4091:4090"  # Mapujemy port 4091 (zewnętrzny) na 4090 (Twój PORT z environment)
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      - DATA_DIR=/data
      - PORT=4090